      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL parser
        run: python -m pip install "pglast>=6,<8"
      - name: Parse every SQL migration and check Drizzle journal
        run: python scripts/db/check_migration_sql.py

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Audit Supabase client environment (no values printed)
        run: node scripts/check-public-env.mjs
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run all domain regression tests
        run: bun run test
      - name: Generate typed TanStack routes and production bundle
        run: bun run build
      - name: TypeScript check
        run: bun run typecheck

