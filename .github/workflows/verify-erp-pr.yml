    env:
      CI: "true"
      DIRECTORS_QA_DSN: postgresql://postgres:qa-only-password@localhost:5432/directors_qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated PostgreSQL test client
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Verify real director vote, PO and payment transition migrations
        run: python scripts/db/test_director_0012_0013_acceptance.py

  material-consumption-acceptance:
