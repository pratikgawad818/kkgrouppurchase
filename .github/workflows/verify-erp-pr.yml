        options: >-
          --health-cmd "pg_isready -U postgres -d company_rls_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      COMPANY_RLS_QA_DSN: postgresql://postgres:qa-only-password@localhost:5432/company_rls_qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated PostgreSQL client
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Test staff, company, stock, payments and storage RLS isolation
        run: python scripts/db/test_company_0020_rls.py

  director-approval-acceptance:
