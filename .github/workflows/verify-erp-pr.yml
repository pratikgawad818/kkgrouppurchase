      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Execute actual migrations 0019 to 0023 in numeric order
        run: python scripts/db/test_release_0019_0023_order.py

  grn-material-end-to-end:
    name: Challan → GRN → Cement building usage (disposable PostgreSQL)
    runs-on: ubuntu-latest
