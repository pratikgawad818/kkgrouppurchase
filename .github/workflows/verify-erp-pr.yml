        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Exercise real goods receipt and issue-return SQL
        run: python scripts/db/test_grn_challan_to_material_0015.py

  small-expenses-acceptance:
    name: Site small expenses (disposable PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
