        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Run material issue/return and consumption integration tests
        run: python scripts/db/test_material_0015_stock_flow.py

  pending-release-ordered-rehearsal:
    name: Release 0019→0023 ordered SQL + RLS (disposable PostgreSQL)
    runs-on: ubuntu-latest
