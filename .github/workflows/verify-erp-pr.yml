    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Verify audited small expenses and company isolation
        run: python scripts/db/test_site_small_expenses_0023.py

  whatsapp-consent-acceptance:
    name: WhatsApp consent and outbox ACL (disposable PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-password
          POSTGRES_DB: whatsapp_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d whatsapp_qa"
          --health-interval 5s
